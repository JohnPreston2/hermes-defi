<style>
/* Mise en page : un studio photo plein écran. La scène 3D occupe tout ; trois éléments seulement
   se posent dessus : le titre en haut à gauche, la rangée des dix en bas, la fiche à droite.
   Un seul thème, sombre par choix : c'est un plateau éclairé dans le noir. */
:root {
  --bg: #07080a;

  --up: #93d8b1;
  --down: #f2977d;
  --display: 'Didot', 'Bodoni 72', 'Bodoni MT', ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --ui: 'Segoe UI Variable Text', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', 'JetBrains Mono', Consolas, monospace;
  --gut: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font: 14px/1.5 var(--ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--champ); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.bar { position: fixed; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gut) 12px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-right: auto; white-space: nowrap; }
.brand b { color: var(--ink); font-weight: 500; }
.brand a { color: var(--ink); text-decoration: none; } .brand a:hover { color: var(--champ); }

.head { position: fixed; z-index: 4; left: var(--gut); top: clamp(76px, 12vh, 120px); width: min(520px, calc(100vw - 2 * var(--gut))); pointer-events: none; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.head.out, .head.hide { opacity: 0; transform: translateY(-8px); }

h1 { margin: 0; font: 400 clamp(32px, 3.6vw, 52px)/1.02 var(--display); letter-spacing: -.012em; text-wrap: balance; }
h1 em { font-style: italic; color: var(--champ); }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bars div { display: grid; grid-template-columns: 74px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font: 400 11px/1 var(--mono); color: var(--ink2); }
.bars span.t { height: 6px; border-radius: 3px; background: rgba(241,237,228,.08); position: relative; overflow: hidden; }

.foot p { margin: 0; }

.hint { position: fixed; z-index: 4; right: var(--gut); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); font: 400 10.5px/1.45 var(--mono); color: var(--muted); pointer-events: none; text-align: right; }

<script type="module">
/* ================================================================ interface (sans 3D) */
const $ = (id) => document.getElementById(id);
let DATA = /*__DATA__*/null;
if (!DATA) {
  try { const r = await fetch('planches.json', { cache: 'no-cache' }); if (!r.ok) throw new Error('planches.json ' + r.status); DATA = await r.json(); }
  catch (e) { $('veil').innerHTML = '<p class="fallback">Les données des planches sont indisponibles pour le moment.</p>'; throw e; }
}
const LOGOS = /*__LOGOS__*/null || new Proxy({}, { get: (_, k) => typeof k === 'string' ? 'logos/' + k : undefined });

const IN_DASH = location.pathname.includes('/planches/');
let HZRAW = /*__HERMES__*/null;
if (!HZRAW && IN_DASH) { try { const r = await fetch('../defi.json', { cache: 'no-cache' }); if (r.ok) HZRAW = await r.json(); } catch (e) { console.warn('lecture Hermes indisponible', e); } }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------- formats */
const nf = (v, d) => v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const NB = ' ';
const usd = (v) => v >= 1e12 ? nf(v / 1e12, 2) + NB + 'T$' : v >= 1e9 ? nf(v / 1e9, v >= 100e9 ? 0 : 1) + NB + 'Md$' : v >= 1e6 ? nf(v / 1e6, v >= 100e6 ? 0 : 1) + NB + 'M$' : v >= 1e4 ? nf(v / 1e6, 2) + NB + 'M$' : nf(v, 0) + NB + '$';
const price = (v) => (v >= 1000 ? nf(v, 0) : v >= 1 ? nf(v, 2) : nf(v, 4)) + NB + '$';
const pct = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), d) + NB + '%';
const share = (v, d = 0) => v == null ? '—' : nf(v * 100, d) + NB + '%';
const cls = (v) => v == null || Math.abs(v) < 0.05 ? '' : v > 0 ? 'up' : 'down';
const two = (n) => String(n).padStart(2, '0');
const when = (iso) => new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(':', ' h ');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const sum = (a, f) => a.reduce((x, y) => x + (f(y) || 0), 0);
const facts = (rows) => `<dl class="facts">${rows.map(([k, v, c]) => `<div><dt>${k}</dt><dd class="${c || ''}">${v}</dd></div>`).join('')}</dl>`;
const bars = (rows) => `<div class="viz bars">${rows.map(([k, f, txt, c]) => `<div><span>${k}</span><span class="t"><b class="${c || ''}" style="width:${Math.max(0, Math.min(1, f || 0)) * 100}%"></b></span><em>${txt}</em></div>`).join('')}</div>`;

      };
      const a1 = util * Math.PI * 2 - GAPA, a2 = (1 - util) * Math.PI * 2 - GAPA;
      const pulses = fees[i] ? Math.max(1, Math.round(1 + 6 * Math.sqrt(fees[i] / fmax) * (a1 / 6.283) * 2.2)) : 0;
      const lent = mk(AMBER, a1, Math.PI / 2 + GAPA / 2, pulses, 1.0, 1);
      const idle = mk(MINT, a2, Math.PI / 2 + a1 + GAPA * 1.5, 0, .34, .55);
      // lunette de métal sombre autour de l'anneau
      const bezelMat = metalBase.clone(); bezelMat.color.set(0x6f6b65); bezelMat.roughness = .34;
      const bezel = new THREE.Mesh(new THREE.TorusGeometry(r + tube * 2.2, Math.max(.008, tube * .22), 10, 220), bezelMat); flip.add(bezel);
      // logo au centre
      const coin = makeCoin(p, Math.max(.2, r * .5), Math.max(.045, r * .045)); const medal = new THREE.Group(); medal.add(coin); pivot.add(medal);
      const sh = shadow(r * 2.4, r * .8); sh.position.set(x, .004, z); group.add(sh);
      objs.push({ i, item: p, pivot, flip, lent, idle, bezel, bezelMat, medal, coin, sh, R: r, x, z, yc: pivot.position.y, f: 0, phase: Math.random() * 6.28,
        pick: [lent, idle, bezel, coin], delay: .3 + (items.length - 1 - i) * .15 + (i === 0 ? .4 : 0) });
    });
    return {
      group, objs, view: { pos: new THREE.Vector3(0, 5.0, 12.6), tgt: new THREE.Vector3(0, 1.05, -.3), glow: new THREE.Color(0x2b1e0e), pool: new THREE.Color(0x120d07), poolZ: -.5, off: -.11, lift: 2.0, refl: .7,
        intro: { pos: new THREE.Vector3(0, 1.85, .4), tgt: new THREE.Vector3(0, 1.8, -2.3) } },
      focus: (o) => ({ tgt: new THREE.Vector3(o.x, o.yc, o.z), dist: 4.2 + o.R * 4.2 }),
      update(ti, t, dt, anyFocus) {
        objs.forEach((o) => {
          const on = o.i === state.sel || o.i === state.hover;
          o.f += ((on ? 1 : 0) - o.f) * damp(dt, 6);
          const e = ease.out(clamp01((ti - o.delay) / .6));
          const g1 = ease.inOut(clamp01((ti - o.delay - .15) / 1.0)), g2 = ease.inOut(clamp01((ti - o.delay - .95) / .7));
          o.lent.material.uniforms.uGrow.value = g1; o.idle.material.uniforms.uGrow.value = g2;
          o.bezel.scale.setScalar(.7 + .3 * e); o.bezel.visible = e > .01;
          const dim = anyFocus && !on ? .28 : 1;
          const u = o.lent.material.uniforms;
          u.uDim.value += (dim + o.f * .25 - u.uDim.value) * damp(dt, 6); o.idle.material.uniforms.uDim.value = u.uDim.value;
          u.uT.value = t + o.phase;
          o.bezelMat.envMapIntensity = .35 + .65 * Math.min(1, u.uDim.value);
          const face = Math.atan2(camera.position.x - o.x, camera.position.z - o.z);
          o.pivot.rotation.y = face + (REDUCED ? 0 : Math.sin(t * .28 + o.phase) * .22 * (1 - o.f));
          o.pivot.position.y = o.yc + o.f * o.R * .05;
          const m = ease.back(clamp01((ti - o.delay - .55) / 1.0));
          o.medal.scale.setScalar(Math.max(.001, Math.min(1, m * 1.12)));
          o.medal.rotation.y = (1 - m) * Math.PI * 3 + (REDUCED ? 0 : Math.sin(t * .5 + o.phase) * .3);
          const mats = o.coin.userData.mats; mats.metal.envMapIntensity = anyFocus && !on ? .35 : 1; mats.face.color.setScalar(anyFocus && !on ? .45 : 1);
          o.sh.material.opacity = .7 * e;
        });
      },
    };
  }

  /* ================= planche : les lingots (actifs réels) ================= */
  function buildIngots(items) {
    const group = new THREE.Group(), objs = [];
    const UNIT = 2e8, L = .64, W = .3, HB = .13, GAP = .006, spacing = 1.18;
    const geo = new RoundedBoxGeometry(L, HB, W, 3, .028);
    { // lingot : dessus plus étroit que la base
      const pa = geo.attributes.position;
      for (let k = 0; k < pa.count; k++) { const y = pa.getY(k), f = THREE.MathUtils.lerp(1, .84, (y + HB / 2) / HB); pa.setX(k, pa.getX(k) * f); pa.setZ(k, pa.getZ(k) * (f * .9 + .1)); }
      geo.computeVertexNormals();
    }
    const METALS = { or: { color: 0xf3c873, roughness: .16 }, argent: { color: 0xe8ebef, roughness: .2 }, cuivre: { color: 0xe0956a, roughness: .22 } };
    const xs = bellX(items.length, spacing), slots = bellSlots(items.length), maxSlot = Math.max(...slots.map(Math.abs));
    items.forEach((p, i) => {
      const x = xs[i], z = -Math.pow(Math.abs(x / spacing), 1.7) * .16;
      const grp = new THREE.Group(); grp.position.set(x, 0, z);
      const m = METALS[p.metal] || METALS.argent;
      const mat = new THREE.MeshPhysicalMaterial({ color: m.color, metalness: 1, roughness: m.roughness, clearcoat: .6, clearcoatRoughness: .1, envMapIntensity: 1.6 });
      const matD = mat.clone(); matD.emissive = new THREE.Color(0x3fe8c2); matD.emissiveIntensity = .32;
      const n = p.tvl / UNIT, full = Math.floor(n), frac = n - full, count = full + (frac > .04 ? 1 : 0), nDefi = p.defi / UNIT;
      const bars = [];
      for (let k = 0; k < count; k++) {
        const b = new THREE.Mesh(geo, k + .5 < nDefi ? matD : mat);
        const len = k < full ? 1 : frac;
        b.scale.x = len; b.userData.y = HB / 2 + k * (HB + GAP);
        b.rotation.y = Math.sin(k * 12.9 + i) * .03;
        b.position.set(Math.sin(k * 7.3 + i) * .018, b.userData.y, Math.cos(k * 5.1 + i) * .01);
        grp.add(b); bars.push(b);
      }
      const top = count * (HB + GAP);
      const coin = makeCoin(p, .34, .06); const pivot = new THREE.Group(); pivot.add(coin); pivot.position.y = top + .55; grp.add(pivot);
      const sh = shadow(1.5, 1.5); sh.position.set(x, .004, z); group.add(sh);
      group.add(grp);
      objs.push({ i, item: p, grp, bars, mat, matD, top, pivot, coin, x, z, f: 0, phase: Math.random() * 6.28, pick: [...bars, coin],
        delay: .2 + (maxSlot - Math.abs(slots[i])) * .2 + (slots[i] > 0 ? .07 : 0) });
    });
    return {
      group, objs, view: { pos: new THREE.Vector3(0, 4.0, 13.2), tgt: new THREE.Vector3(0, 2.5, -.4), glow: new THREE.Color(0x352812), pool: new THREE.Color(0x15110b), poolZ: 0, off: -.075, lift: 2.2 },
      focus: (o) => ({ tgt: new THREE.Vector3(o.x, Math.max(1.2, o.top * .55), o.z), dist: 8.5 }),
      update(ti, t, dt, anyFocus) {
        objs.forEach((o) => {
          const on = o.i === state.sel || o.i === state.hover;
          o.f += ((on ? 1 : 0) - o.f) * damp(dt, 6);
          o.bars.forEach((b, k) => {   // les lingots tombent un à un et s'empilent
            const e = ease.out(clamp01((ti - o.delay - k * .05) / .42));
            b.position.y = b.userData.y + (1 - e) * 2.6; b.visible = e > 0;
          });
          const dim = anyFocus && !on ? .45 : 1.6;
          o.mat.envMapIntensity += (dim - o.mat.envMapIntensity) * damp(dt, 6); o.matD.envMapIntensity = o.mat.envMapIntensity;
          o.matD.emissiveIntensity = .2 * o.mat.envMapIntensity + o.f * .12;
          floatMedal(o, ti, t, anyFocus, on, o.top + .55, o.delay + o.bars.length * .05 + .2);
        });
      },
    };
  }

  /* ---------------- planches : construites à la première ouverture ---------------- */
  const BUILD = {
    crypto: buildCoins,
    defi: () => buildColumns(DATA.defi, { value: (p) => p.tvl, prev30: (p) => p.ch30 != null ? p.tvl / (1 + p.ch30 / 100) : null, fees: (p) => p.fees30,
      deep: 0x010c0a, bright: 0x8ff0d8, glow: 0x0f2b26, pool: 0x0a1513 }),
    lending: () => buildRings(DATA.lending),
    rwa: () => buildIngots(DATA.rwa),
    solana: () => buildColumns(DATA.solana, { value: (p) => p.tvl, prev30: (p) => p.ch30 != null ? p.tvl / (1 + p.ch30 / 100) : null, fees: (p) => p.solOnly ? p.fees30 : null, hex: true,
      deep: 0x07031a, mid: 0x4a24a6, bright: 0x2ee6a6, spark: 0xd8fff0, glow: 0x1c1235, pool: 0x0e0a18, glassTint: 0xe6defa }),
  };
  const SETS = {};
  function ensure(pl) { if (!SETS[pl]) { SETS[pl] = BUILD[pl](); scene.add(SETS[pl].group); } return SETS[pl]; }
  function showOnly(pl) { Object.entries(SETS).forEach(([k, s]) => { s.group.visible = k === pl; }); }

  let active = state.pl; ensure(active); showOnly(active);
  const I0 = SETS[active].view.intro && !REDUCED ? SETS[active].view.intro : null;
  const cur = { pos: (I0 ? I0.pos : SETS[active].view.pos).clone(), tgt: (I0 ? I0.tgt : SETS[active].view.tgt).clone(), off: 0 };
  let tAct = 0, fade = 1, fadeTo = 0, pending = null;

  /* ---------------- post-traitement ---------------- */
  // rendu intermédiaire lissé (4 échantillons) : sans lui, l'anticrénelage du moteur ne s'applique pas
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .42, .55, .86); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const finish = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uT: { value: 0 }, uFade: { value: 1 }, uRes: { value: new THREE.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uT, uFade; uniform vec2 uRes; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        // netteté adaptative au contraste (principe AMD CAS), dosée légèrement
        vec2 px = 1. / uRes;
        vec3 e = texture2D(tDiffuse, vUv).rgb;
        vec3 a = texture2D(tDiffuse, vUv - vec2(px.x, 0.)).rgb, b = texture2D(tDiffuse, vUv + vec2(px.x, 0.)).rgb;
        vec3 c = texture2D(tDiffuse, vUv - vec2(0., px.y)).rgb, d = texture2D(tDiffuse, vUv + vec2(0., px.y)).rgb;
        vec3 mn = min(e, min(min(a, b), min(c, d))), mx = max(e, max(max(a, b), max(c, d)));
        vec3 amp = sqrt(clamp(min(mn, 1. - mx) / max(mx, vec3(1e-4)), 0., 1.));
        vec3 w = amp * (-1. / 6.);
        vec3 col = (e + (a + b + c + d) * w) / (1. + 4. * w);
        vec2 q = vUv - .5; float r2 = dot(q, q);
        col *= mix(1., smoothstep(.62, .06, r2), .5);
        col += (hash(vUv * uRes + fract(uT * 7.31) * 113.) - .5) * .012;
        gl_FragColor = vec4(mix(col, vec3(0.), uFade), 1.); }` });
  composer.addPass(finish);

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    floor.setSize(w * pr, h * pr); finish.uniforms.uRes.value.set(w * pr, h * pr);
    dust.material.uniforms.uPR.value = pr;
  }
  addEventListener('resize', resize); resize();

  /* ---------------- interaction ---------------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), par = new THREE.Vector2();
  function pick(e) {
    const rct = canvas.getBoundingClientRect();
    ptr.set((e.clientX - rct.left) / rct.width * 2 - 1, -((e.clientY - rct.top) / rct.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    let best = -1, bd = Infinity;
    for (const o of SETS[active].objs) {
      const hit = ray.intersectObjects(o.pick, true)[0];
      if (hit && hit.distance < bd) { bd = hit.distance; best = o.i; }
    }
    return best;
  }
  canvas.addEventListener('pointermove', (e) => { par.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); if (e.pointerType === 'mouse' && !pending) { const i = pick(e); setHover(i); canvas.style.cursor = i >= 0 ? 'pointer' : ''; } });
  canvas.addEventListener('pointerleave', () => { setHover(-1); });
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', (e) => { if (!down || pending || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; const i = pick(e); select(i === state.sel ? -1 : i); });

  /* ---------------- boucle ---------------- */
  const clock = new THREE.Clock(); let t = 0, frames = 0, acc = 0;
  const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
  const tag = $('tag');

  function frame() {
    requestAnimationFrame(frame);
    const raw = clock.getDelta(), dt = Math.min(raw, window.__DTCAP || .1);
    t += dt;
    if (typeof window.__TSET === 'number') t = window.__TSET;
    // qualité adaptative : garder ~60 images/s
    acc += raw; frames++;
    if (acc > 1.2) { const ms = acc / frames * 1000; acc = 0; frames = 0;
      if (!window.__NOADAPT) { if (ms > 24 && pr > MINPR) { pr = Math.max(MINPR, pr - .25); resize(); } else if (ms < 13 && pr < MAXPR) { pr = Math.min(MAXPR, pr + .15); resize(); } } }

    // fondu entre planches ; la planche suivante est construite dans le noir
    fade += (fadeTo - fade) * damp(dt, 7);
    if (pending && fade > .97) { active = pending; pending = null; ensure(active); showOnly(active); tAct = t; fadeTo = 0;
      const I = SETS[active].view.intro; if (I && !REDUCED) { cur.pos.copy(I.pos); cur.tgt.copy(I.tgt); } else { cur.pos.copy(SETS[active].view.pos).add(new THREE.Vector3(0, .6, 2.5)); cur.tgt.copy(SETS[active].view.tgt); } }
    finish.uniforms.uFade.value = fade; finish.uniforms.uT.value = t;

    const S = SETS[active], V = S.view, ti = REDUCED ? 99 : t - tAct;
    const lightUp = ease.inOut(clamp01(ti / 2.4));
    scene.environmentIntensity = .95 * lightUp;
    key.intensity = 1.35 * lightUp; const sweep = ease.inOut(clamp01(ti / 3.2));
    key.position.set(-10 + 16 * sweep, 9, 7 - 2 * Math.sin(sweep * Math.PI));
    backdrop.material.uniforms.uGlow.value.copy(V.glow).multiplyScalar(lightUp);
    floor.mat.uniforms.uPool.value.copy(V.pool).multiplyScalar(lightUp);
    floor.mat.uniforms.uPoolC.value.set(0, 0, V.poolZ);
    floor.mat.uniforms.uStrength.value = V.refl || .62;
    dust.material.uniforms.uT.value = t; dust.material.uniforms.uA.value = .8 * lightUp;

    const anyFocus = !pending && (state.sel >= 0 || state.hover >= 0);
    S.update(ti, t, dt, anyFocus);

    // caméra : légère parallaxe, approche de l'objet choisi
    const sel = !pending && state.sel >= 0 ? S.objs[state.sel] : null, ft = sel ? S.focus(sel) : null;
    const asp = innerWidth / innerHeight, kz = asp < 1.3 ? 1.3 / asp : 1;
    const baseT = tmp2.copy(V.tgt); if (asp < 1) baseT.y += V.lift * (1 / asp - 1) * .55;
    const goT = ft ? ft.tgt : baseT;
    const goP = ft ? tmp.copy(V.pos).sub(V.tgt).normalize().multiplyScalar(ft.dist * Math.sqrt(kz)).add(ft.tgt) : tmp.copy(V.pos).sub(V.tgt).multiplyScalar(kz).add(baseT);
    if (!REDUCED) { goP.x += par.x * .55 + Math.sin(t * .07) * .35; goP.y += -par.y * .28; }
    const k = damp(dt, V.intro && ti < 3.2 ? .9 + ti * .35 : 2.1);
    cur.pos.lerp(goP, k); cur.tgt.lerp(goT, k);
    camera.position.copy(cur.pos); camera.lookAt(cur.tgt);
    // décalage de cadre : la scène laisse la place au titre (à gauche) ou à la fiche (à droite)
    const wide = innerWidth >= 900, offGoal = !wide ? 0 : sel ? .1 : V.off;
    cur.off += (offGoal - cur.off) * k;
    if (Math.abs(cur.off) > .001) camera.setViewOffset(innerWidth, innerHeight, cur.off * innerWidth, 0, innerWidth, innerHeight); else camera.clearViewOffset();

    // étiquette de survol, posée sous l'objet
    const hv = !pending && state.hover >= 0 && state.hover !== state.sel ? state.hover : -1;
    if (hv >= 0 && S.objs[hv]) {
      const o = S.objs[hv], p = PL[active];
      tmp.set(o.x, 0, o.z).project(camera);
      tag.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth}px, ${(-tmp.y * .5 + .5) * innerHeight + 10}px) translate(-50%, 0)`;
      tag.innerHTML = `<small>${two(o.item.rank)}</small>${esc(o.item.name)} · ${p.value(o.item)}`;
      tag.classList.add('on');
    } else tag.classList.remove('on');

    floor.update(scene, camera);
    composer.render(dt);
  }

  requestAnimationFrame(frame);
  setTimeout(() => $('veil').classList.add('gone'), 120);

  return {
    switchTo(pl) { pending = pl; fadeTo = 1; if (REDUCED) fade = .98; },
    get t() { return t; }, get pr() { return pr; }, get active() { return active; },
  };
}

start3D().then((api) => { ui.api = api; ui.ready = true; ui.onSwitch = (pl) => api.switchTo(pl); })
  .catch((err) => { console.error(err); ui.ready = true; ui.fail(); });
</script>
</body>
</html>
