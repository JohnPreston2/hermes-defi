<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 10 en relief</title>
<!--FONTS--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"><!--/FONTS-->
<style>
/* Mise en page : un studio photo plein écran. La scène 3D occupe tout ; trois éléments seulement
   se posent dessus : le titre en haut à gauche, la rangée des dix en bas, la fiche à droite.
   Un seul thème, sombre par choix : c'est un plateau éclairé dans le noir. */
:root {
  --bg: #07080a;
  --ink: #f1ede4;
  --ink2: #c8c3b9;
  --muted: #8d9098;
  --line: rgba(241, 237, 228, .13);
  --glass: rgba(14, 15, 18, .64);
  --champ: #dcc9a3;
  --mint: #8ff0d8;
  --amber: #f2b45e;
  --hz: #a68cff;
  --up: #93d8b1;
  --down: #f2977d;
  --display: 'Bodoni Moda', 'Didot', Georgia, serif;
  --ui: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --gut: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font: 14px/1.5 var(--ui); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--champ); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.bar { position: fixed; z-index: 6; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gut) 12px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-right: auto; white-space: nowrap; }
.brand b { color: var(--ink); font-weight: 500; }
.brand a { color: var(--ink); text-decoration: none; } .brand a:hover { color: var(--champ); }
.stale { color: var(--amber); }
.switch { display: inline-flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 3px; gap: 2px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); }
.switch::-webkit-scrollbar { display: none; }
.switch button { flex: 0 0 auto; border: 0; background: none; padding: 8px 14px; border-radius: 999px; font: 500 12px/1 var(--ui); color: var(--ink2); cursor: pointer; white-space: nowrap; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.asof { font: 400 11px/1.3 var(--mono); color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; }

.head { position: fixed; z-index: 4; left: var(--gut); top: clamp(76px, 12vh, 120px); width: min(520px, calc(100vw - 2 * var(--gut))); pointer-events: none; transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.head.out, .head.hide { opacity: 0; transform: translateY(-8px); }
.eyebrow { margin: 0 0 14px; font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--champ); }
h1 { margin: 0; font: 400 clamp(32px, 3.6vw, 52px)/1.02 var(--display); letter-spacing: -.012em; text-wrap: balance; }
h1 em { font-style: italic; color: var(--champ); }
.insight { margin: 16px 0 0; max-width: 44ch; color: var(--ink2); font-size: 15px; line-height: 1.55; text-wrap: pretty; }
.legend { margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; font: 400 11px/1.4 var(--mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 14px; height: 2px; background: var(--champ); }
.legend i.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }
.legend i.disc { width: 9px; height: 9px; border-radius: 50%; background: none; border: 1px solid var(--ink2); }
.legend i.sq { width: 9px; height: 9px; border-radius: 2px; }
.legend i.mint { background: var(--mint); height: 3px; border-radius: 2px; } .legend i.amber { background: var(--amber); height: 3px; border-radius: 2px; }
.legend i.sq.mint, .legend i.sq.amber { height: 9px; }
.legend i.or { background: #e3bb6c; } .legend i.argent { background: #d9dde3; } .legend i.cuivre { background: #cf8a5f; }
.legend i.sol { background: linear-gradient(90deg, #9945ff, #14f195); }

.rail { position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 2px; padding-inline: var(--gut); overflow-x: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: grid; grid-template-columns: 26px auto; align-items: center; gap: 2px 9px; padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; transition: background .25s, border-color .25s, opacity .25s; }
.chip img { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #15171b; }
.chip .k { font: 400 10px/1 var(--mono); letter-spacing: .06em; color: var(--muted); white-space: nowrap; max-width: 15ch; overflow: hidden; text-overflow: ellipsis; }
.chip .v { font: 500 13px/1.15 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.chip:hover, .chip.hot, .chip[aria-pressed="true"] { background: var(--glass); border-color: var(--line); backdrop-filter: blur(12px); }
.rail.dim .chip:not(.hot):not([aria-pressed="true"]) { opacity: .45; }

.tag { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; transform: translate(-50%, 0); padding: 6px 10px; border-radius: 8px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); font: 500 12px/1.3 var(--mono); white-space: nowrap; opacity: 0; transition: opacity .2s; }
.tag.on { opacity: 1; }
.tag small { color: var(--muted); font-weight: 400; margin-right: 6px; }

.card { position: fixed; z-index: 6; right: var(--gut); top: 50%; width: min(340px, calc(100vw - 2 * var(--gut))); max-height: calc(100vh - 190px); overflow: auto; scrollbar-width: thin; transform: translate(16px, -50%); opacity: 0; pointer-events: none; padding: 20px 20px 18px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(20px) saturate(1.15); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
.card.on { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
.card header { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.card header img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #15171b; }
.card h2 { margin: 0; font: 600 17px/1.2 var(--ui); }
.card .kind { margin: 2px 0 0; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink2); font-size: 16px; line-height: 1; }
.big { margin: 18px 0 2px; font: 400 46px/1 var(--display); letter-spacing: -.01em; font-variant-numeric: lining-nums; }
.bigsub { margin: 0; font: 400 12px/1.4 var(--mono); color: var(--champ); }
.facts { margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; }
.facts div { background: rgba(10, 11, 13, .82); padding: 9px 11px; min-width: 0; }
.facts dt { font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 4px 0 0; font: 500 14px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.viz { margin-top: 14px; }
.viz svg { display: block; width: 100%; height: auto; }
.viz p { margin: 6px 0 0; font: 400 11px/1.4 var(--mono); color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 7px; }
.bars div { display: grid; grid-template-columns: 74px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font: 400 11px/1 var(--mono); color: var(--ink2); }
.bars span.t { height: 6px; border-radius: 3px; background: rgba(241,237,228,.08); position: relative; overflow: hidden; }
.bars span.t b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--mint); }
.bars span.t b.r { background: var(--champ); }
.bars span.t b.a { background: var(--amber); }
.bars em { font-style: normal; text-align: right; color: var(--ink); }
.members { margin: 12px 0 0; font: 400 11px/1.45 var(--mono); color: var(--muted); }
.assets { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.assets li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font: 400 11.5px/1.35 var(--mono); color: var(--ink2); }
.assets li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.assets li b { font-weight: 500; color: var(--ink); }
.assets li em { font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }

.foot p { margin: 0; }
.foot { position: fixed; z-index: 4; left: var(--gut); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); max-width: 58ch; font: 400 10.5px/1.45 var(--mono); color: var(--muted); pointer-events: none; }
.hint { position: fixed; z-index: 4; right: var(--gut); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); font: 400 10.5px/1.45 var(--mono); color: var(--muted); pointer-events: none; text-align: right; }
.veil { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: var(--bg); font: 500 11px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); transition: opacity .8s ease; }
.veil.gone { opacity: 0; pointer-events: none; }
.fallback { max-width: 40ch; text-align: center; letter-spacing: .02em; text-transform: none; font: 400 13px/1.5 var(--ui); color: var(--ink2); }

/* lecture Hermes */
.filrow { margin: 16px 0 0; pointer-events: auto; }
.filbtn { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px 9px 11px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--hz) 45%, transparent); background: color-mix(in srgb, var(--hz) 12%, var(--glass)); backdrop-filter: blur(12px); cursor: pointer; font: 500 12px/1 var(--ui); color: var(--ink); }
.filbtn:hover { background: color-mix(in srgb, var(--hz) 22%, var(--glass)); }
.filbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--hz); box-shadow: 0 0 10px var(--hz); }
.filbtn small { font: 400 11px/1 var(--mono); color: var(--ink2); }
.fil { position: fixed; z-index: 6; left: var(--gut); top: clamp(76px, 12vh, 120px); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: min(390px, calc(100vw - 2 * var(--gut))); display: flex; flex-direction: column; border-radius: 18px; background: var(--glass); border: 1px solid color-mix(in srgb, var(--hz) 30%, var(--line)); backdrop-filter: blur(20px) saturate(1.15); opacity: 0; transform: translate(-16px, 0); pointer-events: none; transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
.fil.on { opacity: 1; transform: none; pointer-events: auto; }
.fil header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.fil h2 { margin: 0; font: 400 26px/1.05 var(--display); }
.fil h2 em { font-style: italic; color: var(--hz); }
.fil .sub { grid-column: 1 / -1; margin: 0; font: 400 11px/1.45 var(--mono); color: var(--muted); }
.tally { grid-column: 1 / -1; display: flex; gap: 14px; margin: 6px 0 0; font: 500 11.5px/1 var(--mono); color: var(--ink2); }
.tally { flex-wrap: wrap; row-gap: 6px; }
.tally span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.imp { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
.imp-f { background: var(--ink); } .imp-d { border: 1.5px solid var(--ink); } .imp-n { height: 2px; background: var(--muted); border-radius: 1px; }
.fil ol { list-style: none; margin: 0; padding: 6px 8px 10px; overflow: auto; scrollbar-width: thin; }
.fil li { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 4px 10px; padding: 11px 10px; border-radius: 12px; cursor: default; }
.fil li:hover, .fil li:focus-within, .fil li.hot { background: color-mix(in srgb, var(--hz) 10%, transparent); }
.fil li .w { grid-column: 1; display: flex; align-items: center; gap: 7px; font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.fil li a { grid-column: 1; font: 500 14px/1.35 var(--ui); color: var(--ink); text-decoration: none; text-wrap: pretty; }
.fil li a:hover { text-decoration: underline; text-decoration-color: var(--hz); text-underline-offset: 3px; }
.fil li .m { grid-column: 1; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.fil li img { grid-column: 2; grid-row: 1 / span 3; align-self: center; width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.fil li.sep { display: block; padding: 14px 10px 4px; font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fil li.sep:hover { background: none; }
.fil li .rc { color: var(--ink2); }
.fil .aussi { grid-column: 1; margin: 5px 0 0; padding: 2px 0 0 10px; border-left: 1px solid color-mix(in srgb, var(--hz) 40%, var(--line)); }
.fil .aussi p { margin: 0 0 6px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fil .aussi ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.fil .aussi li { display: block; padding: 0; border-radius: 0; }
.fil .aussi li:hover, .fil .aussi li:focus-within { background: none; }
.fil .aussi a { font: 400 12.5px/1.35 var(--ui); color: var(--ink2); }
.fil .aussi span { display: block; margin-top: 2px; font: 400 10.5px/1.3 var(--mono); color: var(--muted); }
.fil .note { margin: 0; padding: 10px 18px 16px; font: 400 10.5px/1.45 var(--mono); color: var(--muted); border-top: 1px solid var(--line); }
.hz { margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid color-mix(in srgb, var(--hz) 35%, var(--line)); }
.hz h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--hz); }
.hz h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--hz); box-shadow: 0 0 8px var(--hz); }
.hz dl { margin: 0; display: flex; flex-direction: column; gap: 9px; }
.hz dt { font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hz dd { margin: 3px 0 0; font: 400 12.5px/1.45 var(--ui); color: var(--ink); }
.hz q { display: block; margin-top: 4px; font: italic 400 12px/1.45 var(--ui); color: var(--ink2); quotes: none; }
.hz-k { margin: 12px 0 6px; font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hz ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hz li a { font: 500 12.5px/1.35 var(--ui); color: var(--ink); text-decoration: none; }
.hz li a:hover { text-decoration: underline; text-decoration-color: var(--hz); text-underline-offset: 3px; }
.hz li span { display: block; font: 400 10.5px/1.3 var(--mono); color: var(--muted); }
.hz-src { margin: 12px 0 0; font: 400 10.5px/1.45 var(--mono); color: var(--muted); }
.hz-src a { color: var(--hz); text-decoration: none; }
.chip .k i.hzd { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--hz); vertical-align: 1px; }
.legend i.hz { flex: none; box-sizing: border-box; margin: 0; padding: 0; width: 10px; height: 10px; border-radius: 50%; background: none; border: 2px solid var(--hz); }
.foot { transition: opacity .45s ease; } .foot.hide { opacity: 0; }
@media (max-width: 1100px) { .hint { display: none; } }
@media (max-width: 760px) {
  .brand { display: none; }
  .asof { display: none; }
  .bar { justify-content: center; }
  .switch button { padding: 8px 11px; }
  .head { top: calc(64px + env(safe-area-inset-top, 0px)); }
  h1 { font-size: 30px; }
  .insight { font-size: 13.5px; margin-top: 10px; }
  .legend { font-size: 10px; gap: 2px 12px; }
  .foot { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  .rail { justify-content: flex-start; }
  .card { top: auto; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translate(0, 16px); max-height: 62vh; }
  .card.on { transform: translate(0, 0); }
  .big { font-size: 36px; margin-top: 12px; }
  .fil { top: auto; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); max-height: 66vh; transform: translate(0, 16px); }
  .fil.on { transform: none; }
  .filrow { margin-top: 10px; }
}
.switch .sep { flex: 0 0 auto; align-self: center; margin: 0 4px 0 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--hz); }
.switch button.h::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--hz); margin-right: 7px; vertical-align: 1px; }
.rail.many { justify-content: flex-start; }
.rail { justify-content: flex-start; } .rail > .chip:first-child { margin-inline-start: auto; } .rail > .chip:last-child { margin-inline-end: auto; }
@media (prefers-reduced-motion: reduce) { .card, .head, .tag, .chip { transition: none; } }
/* défilement (09/10) : la page ne défile pas ; quatre zones défilent (rangée du bas, barre des onglets, fiche, fil).
   Fondus et trait suivent la position de défilement, rien ne bouge seul. Sans prise en charge ou en mouvement réduit :
   ni fondu ni trait, le contenu reste tel quel. */
.hint { transition: opacity .45s ease; } .hint.hide { opacity: 0; }
@media (max-width: 760px) { body.filon .foot { opacity: 0; } }
.fil li.sep, .fil li.sep:hover { position: sticky; top: -6px; z-index: 1; margin: 0 -8px; padding: 14px 18px 6px; border-radius: 0; background: rgb(12, 13, 16); }
.card header { position: sticky; top: -20px; z-index: 2; margin-top: -20px; padding: 20px 0 12px; margin-bottom: -12px; }
.card header::before { content: ''; position: absolute; inset: 0 -20px; z-index: -1; background: rgb(13, 14, 17); border-bottom: 1px solid var(--line); }
.railbar { display: none; }
@keyframes pl-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pl-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes pl-bar { from { transform: scaleX(var(--v0, .3)); } to { transform: scaleX(1); } }
@supports (animation-timeline: scroll()) {
  @media (prefers-reduced-motion: no-preference) {
    body { timeline-scope: --rail-x; }
    .rail { scroll-timeline: --rail-x inline; }
    .switch { scroll-timeline: --tabs-x inline; }
    .card { scroll-timeline: --card-y block; }
    .fil ol { scroll-timeline: --fil-y block; }
    .rail::before, .rail::after, .switch::before, .switch::after { content: ''; position: sticky; z-index: 2; flex: 0 0 auto; align-self: stretch; pointer-events: none; opacity: 0; }
    .rail::before, .rail::after { width: 56px; }
    .rail::before { left: calc(-1 * var(--gut)); margin-right: -58px; background: linear-gradient(90deg, rgba(7, 8, 10, .92), rgba(7, 8, 10, 0)); animation: pl-in linear both; animation-timeline: --rail-x; animation-range: 0 32px; }
    .rail::after { right: calc(-1 * var(--gut)); margin-left: -58px; background: linear-gradient(270deg, rgba(7, 8, 10, .92), rgba(7, 8, 10, 0)); animation: pl-out linear both; animation-timeline: --rail-x; animation-range: calc(100% - 32px) 100%; }
    .switch::before, .switch::after { width: 30px; }
    .switch::before { left: -3px; margin-right: -32px; border-radius: 999px 0 0 999px; background: linear-gradient(90deg, rgba(14, 15, 18, .97), rgba(14, 15, 18, 0)); animation: pl-in linear both; animation-timeline: --tabs-x; animation-range: 0 24px; }
    .switch::after { right: -3px; margin-left: -32px; border-radius: 0 999px 999px 0; background: linear-gradient(270deg, rgba(14, 15, 18, .97), rgba(14, 15, 18, 0)); animation: pl-out linear both; animation-timeline: --tabs-x; animation-range: calc(100% - 24px) 100%; }
    .card::after { content: ''; display: block; position: sticky; bottom: -18px; height: 44px; margin: -44px -20px 0; pointer-events: none; background: linear-gradient(rgba(13, 14, 17, 0), rgba(13, 14, 17, .94)); opacity: 0; animation: pl-out linear both; animation-timeline: --card-y; animation-range: calc(100% - 24px) 100%; }
    .card header::before { opacity: 0; animation: pl-in linear both; animation-timeline: --card-y; animation-range: 0 14px; }
    .fil ol::after { content: ''; display: block; position: sticky; bottom: -10px; height: 44px; margin: -44px -8px 0; pointer-events: none; background: linear-gradient(rgba(12, 13, 16, 0), rgba(12, 13, 16, .94)); opacity: 0; animation: pl-out linear both; animation-timeline: --fil-y; animation-range: calc(100% - 24px) 100%; }

const IMPACT = { 'value-accretive': ['favorable', 'f'], adverse: ['défavorable', 'd'], neutral: ['neutre', 'n'] };
const SECN = { macro: 'macro', dex: 'échanges', stablecoin: 'stablecoins', rwa: 'actifs réels', lending: 'prêt', perp: 'perpétuels', lst: 'staking liquide', governance: 'régulation' };
const COIN_RE = [['bitcoin', /\b[Bb]itcoin\b|\bBTC\b/], ['ethereum', /\b[Ee]ther(eum)?\b|\bETH\b/], ['tether', /\b[Tt]ether\b|\bUSDT\b/], ['binancecoin', /\bBNB\b|\b[Bb]inance\b/],
  ['ripple', /\bXRP\b|\b[Rr]ipple\b/], ['usd-coin', /\bUSDC\b|\bCircle\b/], ['solana', /\b[Ss]olana\b|\bSOL\b/], ['tron', /\b[Tt]ron\b|\bTRX\b/], ['figure-heloc', /\bFigure\b/], ['zcash', /\b[Zz]cash\b|\bZEC\b/]];
function coinOf(h) {
  let best = -1, pos = 1e9;
  COIN_RE.forEach(([id, re]) => { const m = h.match(re); if (m && m.index < pos) { const i = C.findIndex((c) => c.id === id); if (i >= 0) { pos = m.index; best = i; } } });
  return best;
}
/* Le fil vient du bloc fil_48h (les passages des 48 dernières heures, titres proches rangés ensemble) ;
   à défaut, du dernier passage seul (hot_news) ; à défaut, il se déclare manquant — jamais il ne disparaît en silence. */
function filData() {
  if (!HZRAW || !HZRAW.blocks) return IN_DASH ? { err: 'lecture de defi.json impossible' } : null;
  const F = HZRAW.blocks.fil_48h, H = HZRAW.blocks.hot_news;
  if (F && F.v && (F.v.groupes || []).length) return { v: F.v };
  if (H && H.v && (H.v.news || []).length) return { v: { fenetre_h: null, dernier_passage: H.v.ts, passages: [{ ts: H.v.ts, n: H.v.news.length, model: H.v.model }],
    groupes: H.v.news.map((n) => ({ items: [Object.assign({ vu_dernier: H.v.ts }, n)] })) } };
  return { err: (F && F.err) || (H && H.err) || 'bloc absent de defi.json' };
}
const FIL = filData();
const hhmm = (ts) => new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }).replace(':', ' h ');
const impW = (k) => (IMPACT[k] || [k || 'non classée', 'n']);
function reclass(x) {   // classements différents selon le passage : transcrits du plus ancien au plus récent
  if (!x.impacts || x.impacts.length < 2) return '';
  const seq = x.impacts.slice().reverse().filter((k, i, a) => !i || k.impact !== a[i - 1].impact);
  return 'classée ' + seq.map((k) => `${impW(k.impact)[0]} le ${dayFR(k.ts)} à ${hhmm(k.ts)}`).join(', puis ');
}
function filItem(g) {
  const x = g.items[0], [w, c] = impW(x.impact), ci = coinOf(x.headline || ''), rc = reclass(x);
  const s = SECN[x.sector] || (x.sector && x.sector !== 'none' ? x.sector : '');
  const aussi = g.items.slice(1).map((y) => { const wy = impW(y.impact)[0], ry = reclass(y);
    return `<li><a href="${escA(y.url)}" target="_blank" rel="noopener">${esc(y.headline)}</a><span>${esc(y.source || '')}${wy !== w ? ' · ' + esc(wy) : ''}${ry ? ' · ' + ry : ''}</span></li>`; }).join('');
  return `<li data-c="${ci}"><span class="w"><i class="imp imp-${c}"></i>${esc(w)}</span><a href="${escA(x.url)}" target="_blank" rel="noopener">${esc(x.headline)}</a><span class="m">${esc(x.source || '')}${s ? ' · ' + esc(s) : ''}</span>` +
    (rc ? `<span class="m rc">${rc}</span>` : '') + (aussi ? `<div class="aussi"><p>Même sujet</p><ul>${aussi}</ul></div>` : '') +
    (ci >= 0 ? `<img src="${LOGOS[C[ci].logo]}" alt="${esc(C[ci].sym)}">` : '') + '</li>';
}
function renderFil() {
  const fil = $('fil'), btn = $('filbtn'), row = $('filrow');

  row.hidden = !on; if (!on) { closeFil(); return; }

  box(1.1, 7, -8, 2.5, 2, 5.5, 0xe6eeff);  // bande gauche, froide

    crypto: buildCoins,
    defi: () => buildColumns(DATA.defi, { value: (p) => p.tvl, prev30: (p) => p.ch30 != null ? p.tvl / (1 + p.ch30 / 100) : null, fees: (p) => p.fees30,
      deep: 0x010c0a, bright: 0x8ff0d8, glow: 0x0f2b26, pool: 0x0a1513 }),
    lending: () => buildRings(DATA.lending),
    rwa: () => buildIngots(DATA.rwa),
    solana: () => buildColumns(DATA.solana, { value: (p) => p.tvl, prev30: (p) => p.ch30 != null ? p.tvl / (1 + p.ch30 / 100) : null, fees: (p) => p.solOnly ? p.fees30 : null, hex: true,
      deep: 0x07031a, mid: 0x4a24a6, bright: 0x2ee6a6, spark: 0xd8fff0, glow: 0x1c1235, pool: 0x0e0a18, glassTint: 0xe6defa }),
    valo: () => buildValo(PL.valo.items, PL.valo.meta),
    attention: () => buildAttention(PL.attention.items, PL.attention.meta),
    cohorte: () => buildCohorte(PL.cohorte.items),
    stables: () => buildStables(PL.stables.items, PL.stables.meta),
  };
  const SETS = {};
  function ensure(pl) { if (!SETS[pl]) { SETS[pl] = BUILD[pl](); scene.add(SETS[pl].group); } return SETS[pl]; }
  function showOnly(pl) { Object.entries(SETS).forEach(([k, s]) => { s.group.visible = k === pl; }); }

  let active = state.pl; ensure(active); showOnly(active);
  const I0 = SETS[active].view.intro && !REDUCED ? SETS[active].view.intro : null;
  const cur = { pos: (I0 ? I0.pos : SETS[active].view.pos).clone(), tgt: (I0 ? I0.tgt : SETS[active].view.tgt).clone(), off: 0 };
  let tAct = 0, fade = 1, fadeTo = 0, pending = null;

  /* ---------------- post-traitement ---------------- */
  // rendu intermédiaire lissé (4 échantillons) : sans lui, l'anticrénelage du moteur ne s'applique pas
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .42, .55, .86); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const finish = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uT: { value: 0 }, uFade: { value: 1 }, uRes: { value: new THREE.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uT, uFade; uniform vec2 uRes; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        // netteté adaptative au contraste (principe AMD CAS), dosée légèrement
        vec2 px = 1. / uRes;
        vec3 e = texture2D(tDiffuse, vUv).rgb;
        vec3 a = texture2D(tDiffuse, vUv - vec2(px.x, 0.)).rgb, b = texture2D(tDiffuse, vUv + vec2(px.x, 0.)).rgb;
        vec3 c = texture2D(tDiffuse, vUv - vec2(0., px.y)).rgb, d = texture2D(tDiffuse, vUv + vec2(0., px.y)).rgb;
        vec3 mn = min(e, min(min(a, b), min(c, d))), mx = max(e, max(max(a, b), max(c, d)));
        vec3 amp = sqrt(clamp(min(mn, 1. - mx) / max(mx, vec3(1e-4)), 0., 1.));
        vec3 w = amp * (-1. / 6.);
        vec3 col = (e + (a + b + c + d) * w) / (1. + 4. * w);
        vec2 q = vUv - .5; float r2 = dot(q, q);
        col *= mix(1., smoothstep(.62, .06, r2), .5);
        col += (hash(vUv * uRes + fract(uT * 7.31) * 113.) - .5) * .012;
        gl_FragColor = vec4(mix(col, vec3(0.), uFade), 1.); }` });
  composer.addPass(finish);

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    floor.setSize(w * pr, h * pr); finish.uniforms.uRes.value.set(w * pr, h * pr);
    dust.material.uniforms.uPR.value = pr;
  }
  addEventListener('resize', resize); resize();

  /* ---------------- interaction ---------------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), par = new THREE.Vector2();
  function pick(e) {
    const rct = canvas.getBoundingClientRect();
    ptr.set((e.clientX - rct.left) / rct.width * 2 - 1, -((e.clientY - rct.top) / rct.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    let best = -1, bd = Infinity;
    for (const o of SETS[active].objs) {
      const hit = ray.intersectObjects(o.pick, true)[0];
      if (hit && hit.distance < bd) { bd = hit.distance; best = o.i; }
    }
    return best;
  }
  canvas.addEventListener('pointermove', (e) => { par.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); if (e.pointerType === 'mouse' && !pending) { const i = pick(e); setHover(i); canvas.style.cursor = i >= 0 ? 'pointer' : ''; } });
  canvas.addEventListener('pointerleave', () => { setHover(-1); });
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', (e) => { if (!down || pending || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; const i = pick(e); select(i === state.sel ? -1 : i); });

  /* ---------------- boucle ---------------- */
  const clock = new THREE.Clock(); let t = 0, frames = 0, acc = 0;
  const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
  const tag = $('tag');

  function frame() {
    requestAnimationFrame(frame);
    const raw = clock.getDelta(), dt = Math.min(raw, window.__DTCAP || .1);
    t += dt;
    if (typeof window.__TSET === 'number') t = window.__TSET;
    // qualité adaptative : garder ~60 images/s
    acc += raw; frames++;
    if (acc > 1.2) { const ms = acc / frames * 1000; acc = 0; frames = 0;
      if (!window.__NOADAPT) { if (ms > 24 && pr > MINPR) { pr = Math.max(MINPR, pr - .25); resize(); } else if (ms < 13 && pr < MAXPR) { pr = Math.min(MAXPR, pr + .15); resize(); } } }

    // fondu entre planches ; la planche suivante est construite dans le noir
    fade += (fadeTo - fade) * damp(dt, 7);
    if (pending && fade > .97) { active = pending; pending = null; ensure(active); showOnly(active); tAct = t; fadeTo = 0;
      const I = SETS[active].view.intro; if (I && !REDUCED) { cur.pos.copy(I.pos); cur.tgt.copy(I.tgt); } else { cur.pos.copy(SETS[active].view.pos).add(new THREE.Vector3(0, .6, 2.5)); cur.tgt.copy(SETS[active].view.tgt); } }
    finish.uniforms.uFade.value = fade; finish.uniforms.uT.value = t;

    const S = SETS[active], V = S.view, ti = REDUCED ? 99 : t - tAct;
    const VT = innerWidth < innerHeight && V.tel ? V.tel : null;   // cadrage propre au téléphone (portrait)
    const fov = (VT && VT.fov) || V.fov || 34; if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    const lightUp = ease.inOut(clamp01(ti / 2.4));
    scene.environmentIntensity = .95 * lightUp;
    key.intensity = 1.35 * lightUp; const sweep = ease.inOut(clamp01(ti / 3.2));
    key.position.set(-10 + 16 * sweep, 9, 7 - 2 * Math.sin(sweep * Math.PI));
    backdrop.material.uniforms.uGlow.value.copy(V.glow).multiplyScalar(lightUp);
    floor.mat.uniforms.uPool.value.copy(V.pool).multiplyScalar(lightUp);
    floor.mat.uniforms.uPoolC.value.set(0, 0, V.poolZ);
    floor.mat.uniforms.uStrength.value = V.refl || .62;
    dust.material.uniforms.uT.value = t; dust.material.uniforms.uA.value = .8 * lightUp;

    const anyFocus = !pending && (state.sel >= 0 || state.hover >= 0);
    S.update(ti, t, dt, anyFocus);

    // caméra : légère parallaxe, approche de l'objet choisi
    const sel = !pending && state.sel >= 0 ? S.objs[state.sel] : null, ft = sel ? S.focus(sel) : null;
    const asp = innerWidth / innerHeight, kzF = asp < 1.3 ? 1.3 / asp : 1, kz = VT ? Math.max(.8, .46 / asp) : kzF;
    const vP = VT ? VT.pos : V.pos, vT = VT ? VT.tgt : V.tgt;
    const baseT = tmp2.copy(vT); if (asp < 1 && !VT) baseT.y += V.lift * (1 / asp - 1) * .55;
    const goT = ft ? ft.tgt : baseT;
    const goP = ft ? tmp.copy(vP).sub(vT).normalize().multiplyScalar(ft.dist * Math.sqrt(kzF)).add(ft.tgt) : tmp.copy(vP).sub(vT).multiplyScalar(kz).add(baseT);
    if (!REDUCED) { goP.x += par.x * .55 + Math.sin(t * .07) * .35; goP.y += -par.y * .28; }
    const k = damp(dt, V.intro && ti < 3.2 ? .9 + ti * .35 : 2.1);
    cur.pos.lerp(goP, k); cur.tgt.lerp(goT, k);
    camera.position.copy(cur.pos); camera.lookAt(cur.tgt);
    // décalage de cadre : la scène laisse la place au titre (à gauche) ou à la fiche (à droite)
    // sur écran étroit, la fiche couvre le bas : l'objet choisi remonte au-dessus d'elle
    const wide = innerWidth >= 900, offGoal = !wide ? 0 : sel ? .1 : V.off, offYGoal = !wide && sel ? .26 : 0;
    cur.off += (offGoal - cur.off) * k; cur.offY = (cur.offY || 0) + (offYGoal - (cur.offY || 0)) * k;
    if (Math.abs(cur.off) > .001 || Math.abs(cur.offY) > .001) camera.setViewOffset(innerWidth, innerHeight, cur.off * innerWidth, cur.offY * innerHeight, innerWidth, innerHeight); else camera.clearViewOffset();

    // étiquette de survol, posée sous l'objet
    const hv = !pending && state.hover >= 0 && state.hover !== state.sel ? state.hover : -1;
    if (hv >= 0 && S.objs[hv]) {
      const o = S.objs[hv], p = PL[active];
      tmp.set(o.x, o.tagY || 0, o.z).project(camera);
      tag.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth}px, ${(-tmp.y * .5 + .5) * innerHeight + 10}px) translate(-50%, 0)`;
      tag.innerHTML = `<small>${two(o.item.rank)}</small>${esc(o.item.name)} · ${p.value(o.item)}`;
      tag.classList.add('on');
    } else tag.classList.remove('on');

    floor.update(scene, camera);
    composer.render(dt);
  }

  requestAnimationFrame(frame);
  setTimeout(() => $('veil').classList.add('gone'), 120);

  return {
    switchTo(pl) { fadeTo = 1; if (REDUCED) fade = .98; loadPl(pl).then(() => { if (state.pl === pl) pending = pl; }); },
    get t() { return t; }, get pr() { return pr; }, get active() { return active; },
  };
}

start3D().then((api) => { ui.api = api; ui.ready = true; ui.onSwitch = (pl) => api.switchTo(pl); })
  .catch((err) => { console.error(err); ui.ready = true; ui.fail(); });
</script>
</body>
</html>
